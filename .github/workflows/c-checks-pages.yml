name: C checks and Pages
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/c-checks-pages.yml'
      - 'src/site_*.py'
      - 'src/browser_qa*.py'
      - 'src/verify_served_v2.py'
  pull_request:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Optional retained C commit/tag for a checked recovery deployment'
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: c-pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Software and leakage contracts (no NFL fits)
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: python -m unittest discover -s tests -v
      - run: node --check docs/app.js
      - if: ${{ hashFiles('docs/forward.js') != '' }}
        run: node --check docs/forward.js
      - run: python src/site_validate_v2.py
      - if: ${{ hashFiles('src/site_validate_forward_v4.py') != '' }}
        run: python src/site_validate_forward_v4.py
      - name: Verify immutable prospective captures
        if: ${{ hashFiles('src/prospective_v4.py') != '' }}
        run: python src/prospective_v4.py verify --root prospective
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - run: python src/site_stamp_v2.py --commit "$(git rev-parse HEAD)"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
        id: deployment
