name: C checks and Pages
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/c-checks-pages.yml'
      - 'src/site_*.py'
      - 'src/browser_qa*.py'
      - 'src/verify_served_v2.py'
  pull_request:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Optional retained C commit/tag for a checked recovery deployment'
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: c-pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Software and leakage contracts (no NFL fits)
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: python -m unittest discover -s tests -v
      - run: node --check docs/app.js
      - if: ${{ hashFiles('docs/forward.js') != '' }}
        run: node --check docs/forward.js
      - run: node --check docs/paper.js
      - run: node --check docs/accuracy.js
      - run: node --check docs/championship.js
      - if: ${{ hashFiles('docs/context.js') != '' }}
        run: node --check docs/context.js
      - if: ${{ hashFiles('docs/data/context-matchup-v1.json') != '' }}
        run: python src/context_site_validate_c01.py
      - name: Verify C04 matched timing and current consumer (no fits)
        if: ${{ hashFiles('docs/data/profile-closure-next-02.json') != '' }}
        run: python src/site_profile_closure_c04.py --validate
      - name: Verify exact timing receipts and C05 shadow consumer (no fits)
        if: ${{ hashFiles('docs/data/timing-confirm-c05.json') != '' }}
        run: python src/site_timing_confirm_c05.py --validate
      - name: Verify consolidated category decisions and owner scopes (no fits)
        if: ${{ hashFiles('docs/data/category-decisions-c06.json') != '' }}
        run: python src/site_category_decisions_c06.py --validate
      - run: node --check docs/qualification.js
      - run: python src/site_qualification_5w.py validate
      - name: Verify period bindings, aggregate-to-site parity and saved final CSV (no fits)
        run: |
          python src/abc_period_validation_v2.py
          python src/site_shared_c01.py validate
          python scripts/export_week8_final_v2.py
      - if: ${{ hashFiles('docs/reliability.js') != '' }}
        run: node --check docs/reliability.js
      - if: ${{ hashFiles('docs/week8.js') != '' }}
        run: node --check docs/week8.js
      - if: ${{ hashFiles('docs/topk.js') != '' }}
        run: node --check docs/topk.js
      - name: Verify actual-prop scorecard from retained rows
        run: python src/actual_accuracy_v6.py validate
      - name: Verify selected-side reliability against canonical rows (no fits)
        if: ${{ hashFiles('docs/data/reliability-v8.json') != '' }}
        run: python src/site_reliability_v8.py validate
      - name: Reconcile append-only Week 8 results against immutable forecasts (no fits)
        if: ${{ hashFiles('docs/data/week8-results-v9.json') != '' }}
        run: python src/week8_report_v9.py validate
      - name: Reconcile fixed Top-K control and own memberships (no fits)
        if: ${{ hashFiles('docs/data/topk-reference-v9.json') != '' }}
        run: python src/topk_report_v9.py validate
      - run: python src/site_paper_v5.py validate
      - run: python src/site_validate_v2.py
      - if: ${{ hashFiles('src/site_validate_forward_v4.py') != '' }}
        run: python src/site_validate_forward_v4.py
      - name: Verify immutable prospective captures
        if: ${{ hashFiles('src/prospective_v4.py') != '' }}
        run: python src/prospective_v4.py verify --root prospective
      - name: Verify immutable paper captures
        run: python src/paper_v5.py verify --root paper
      - name: Verify freshness query shadow (no fits)
        if: ${{ hashFiles('prospective/shadows/AUDIT-D2-C-REC-W09-01/RUN.json') != '' }}
        run: python src/freshness_query_shadow_v1.py verify --output prospective/shadows/AUDIT-D2-C-REC-W09-01
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - run: python src/site_stamp_v2.py --commit "$(git rev-parse HEAD)"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
        id: deployment
